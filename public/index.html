<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="pageTitle">Home \ User</title>
<style>
    :root {
        --bg: #080808; --surf: #1e1f20; --txt: #e3e3e3; --sec: #9aa0a6;
        --blue: #a8c7fa; --blue-sol: #4285f4;
        --fnt: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: var(--bg); color: var(--txt); font-family: var(--fnt);
        overflow: hidden; -webkit-font-smoothing: antialiased;
    }

    /* Inline SVG icon system */
    .icon {
        width: 24px; height: 24px;
        display: inline-block; flex-shrink: 0;
        fill: currentColor; vertical-align: middle;
        pointer-events: none;
    }
    .icon-sm { width: 18px; height: 18px; }
    .icon-lg { width: 26px; height: 26px; }
    .icon-xl { width: 48px; height: 48px; }

    /* Loading Screen */
    #loading-screen {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: var(--bg); z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.3s ease; opacity: 1;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
        width: 32px; height: 32px;
        border: 2.5px solid rgba(255,255,255,0.08);
        border-top-color: var(--blue-sol);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #content { opacity: 0; transition: opacity 0.4s ease; }
    #content.show { opacity: 1; }

    .main-view {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        text-align: center; width: 90%; z-index: 5;
    }
    .title {
        font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight: 400; letter-spacing: -0.5px;
        background: linear-gradient(180deg, #fff 0%, #c4c7c5 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;
    }

    /* Top-right controls */
    .top-controls {
        position: absolute; top: 24px; right: 24px;
        display: flex; align-items: center; gap: 12px; z-index: 60;
    }
    .app-launcher-btn {
        width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
        border: 2px solid rgba(255,255,255,0.1);
        background: var(--surf);
        display: flex; align-items: center; justify-content: center;
        transition: border-color 0.2s ease, background 0.2s ease;
        padding: 0; color: var(--txt);
    }
    .app-launcher-btn:hover { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.05); }

    .profile-btn {
        width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
        border: 2px solid rgba(255,255,255,0.1);
        overflow: hidden; background: var(--surf);
        display: flex; align-items: center; justify-content: center;
        transition: border-color 0.2s ease; padding: 0; position: relative;
    }
    .profile-btn:hover { border-color: rgba(255,255,255,0.25); }
    .profile-btn img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    .profile-btn .initials { font-size: 1.2rem; font-weight: 500; color: var(--sec); font-family: var(--fnt); user-select: none; }

    /* App grid popup */
    .app-grid-popup {
        position: absolute; top: 80px; right: 24px;
        width: 320px; background: var(--surf);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px; padding: 16px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        z-index: 70; display: none; opacity: 0;
        transform: translateY(-8px) scale(0.97);
        transition: opacity 0.2s ease, transform 0.2s ease;
        max-height: 70vh; overflow-y: auto;
    }
    .app-grid-popup.open { display: block; opacity: 1; transform: translateY(0) scale(1); }
    .app-grid-popup::-webkit-scrollbar { width: 4px; }
    .app-grid-popup::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    .app-grid-title {
        font-size: 0.8rem; color: var(--sec); text-transform: uppercase;
        letter-spacing: 0.5px; margin-bottom: 12px; padding-left: 4px;
    }
    .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .app-grid-item {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 6px; padding: 12px 4px;
        border-radius: 14px; cursor: pointer;
        background: transparent; border: 1px solid transparent;
        transition: background 0.2s ease, border-color 0.2s ease;
        text-decoration: none; color: var(--txt);
    }
    .app-grid-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.08); }
    .app-grid-item .icon { color: var(--blue); }
    .app-grid-item .app-name { font-size: 0.75rem; color: var(--sec); text-align: center; line-height: 1.2; }

    .prompt-container {
        position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
        width: 90%; max-width: 680px; z-index: 5;
    }
    .prompt-box {
        display: flex; align-items: center; justify-content: space-between;
        background: var(--surf); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 28px; padding: 6px 6px 6px 24px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        min-height: 64px;
    }
    .prompt-box:focus-within {
        border-color: var(--blue-sol);
        box-shadow: 0 8px 40px rgba(66, 133, 244, 0.15);
    }
    .prompt-box input {
        flex: 1; background: transparent; border: none; outline: none;
        color: var(--txt); font-family: var(--fnt); font-size: 1.05rem;
        padding: 18px 0; min-width: 0; line-height: 1.5;
    }
    .prompt-box input::placeholder { color: var(--sec); font-size: 1rem; }
    .prompt-btn {
        background: var(--blue); border: none; border-radius: 50%;
        width: 52px; height: 52px; min-width: 52px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.2s ease, transform 0.15s ease;
        color: #042f66;
    }
    .prompt-btn:hover { background: #c2dbff; }
    .prompt-btn:active { transform: scale(0.94); }

    .mask {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        z-index: 80; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .mask.active { opacity: 1; pointer-events: auto; }

    .dialog {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
        width: 85%; max-width: 360px; background: var(--surf); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px; z-index: 100; padding: 24px; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
        display: flex; flex-direction: column; opacity: 0; pointer-events: none;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); box-sizing: border-box;
        max-height: 80vh; overflow-y: auto;
    }
    .dialog.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
    .d-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .d-title { font-size: 1.3rem; font-weight: 400; color: #fff; font-family: var(--fnt); }
    .d-close {
        background: transparent; border: none; cursor: pointer; width: 36px; height: 36px;
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        color: var(--sec); padding: 0;
    }
    .d-close:hover { background: rgba(255, 255, 255, 0.08); }
    .f-group { margin-bottom: 20px; display: flex; flex-direction: column; width: 100%; }
    .f-lbl { margin-bottom: 8px; font-size: 0.85rem; color: var(--blue); font-weight: 500; font-family: var(--fnt); }
    .f-in {
        width: 100%; padding: 12px 14px; background: #282a2c; border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px; color: var(--txt); font-family: var(--fnt); font-size: 1rem; outline: none; box-sizing: border-box;
    }
    .f-in:focus { border-color: var(--blue-sol); background: #131415; }
    .f-btn {
        background: var(--blue); color: #042f66; border: none; padding: 12px 24px;
        border-radius: 100px; font-family: var(--fnt); font-weight: 500; font-size: 0.95rem;
        cursor: pointer; width: 100%; text-align: center; box-sizing: border-box;
    }
    .f-btn:hover { background: #c2dbff; }

    .upload-area {
        border: 2px dashed rgba(255,255,255,0.1);
        border-radius: 12px; padding: 20px; text-align: center;
        cursor: pointer; transition: all 0.2s ease;
        background: rgba(255,255,255,0.02);
    }
    .upload-area:hover { border-color: var(--blue-sol); background: rgba(255,255,255,0.05); }
    .upload-area.dragover { border-color: var(--blue-sol); background: rgba(66,133,244,0.1); }
    .upload-area input[type="file"] { display: none; }
    .upload-area .upload-text { color: var(--sec); font-size: 0.9rem; }
    .upload-area .upload-text strong { color: var(--txt); }
    .upload-preview {
        width: 80px; height: 80px; border-radius: 50%;
        object-fit: cover; margin: 10px auto; display: none;
        border: 2px solid rgba(255,255,255,0.1);
    }
    .upload-preview.show { display: block; }
    .upload-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: center; }
    .upload-actions button {
        padding: 6px 16px; border-radius: 100px; border: none;
        cursor: pointer; font-family: var(--fnt); font-size: 0.85rem;
        transition: all 0.2s ease;
        display: flex; align-items: center; gap: 4px;
    }
    .upload-actions .btn-upload { background: var(--blue); color: #042f66; }
    .upload-actions .btn-upload:hover { background: #c2dbff; }
    .upload-actions .btn-remove { background: rgba(255,255,255,0.08); color: var(--sec); }
    .upload-actions .btn-remove:hover { background: rgba(255,255,255,0.15); }

    .link-item {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 12px; background: rgba(255,255,255,0.03);
        border-radius: 12px; margin-bottom: 8px; gap: 8px;
    }
    .link-item .link-info { display: flex; flex-direction: column; align-items: flex-start; flex: 1; min-width: 0; }
    .link-item .link-key { font-weight: 500; font-size: 0.95rem; color: var(--txt); }
    .link-item .link-url {
        font-size: 0.75rem; color: var(--sec);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px;
    }
    .link-item .link-actions { display: flex; gap: 6px; }
    .link-item .link-actions button {
        background: transparent; border: none; cursor: pointer;
        padding: 4px 8px; border-radius: 6px; color: var(--sec);
        font-size: 0.85rem; transition: all 0.2s ease;
        display: flex; align-items: center;
    }
    .link-item .link-actions button:hover { background: rgba(255,255,255,0.08); color: var(--txt); }
    .link-item .link-actions .del:hover { color: #ff6b6b; }
    .link-item .link-actions .icon { width: 20px; height: 20px; }

    .notifier {
        position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
        background: var(--surf); color: var(--txt); padding: 12px 24px;
        border-radius: 100px; border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 200;
        opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        font-size: 0.95rem;
        display: flex; align-items: center; gap: 8px;
    }
    .notifier.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .notifier.success { border-color: #34a853; }
    .notifier.error { border-color: #ea4335; }
    .notifier .icon { width: 20px; height: 20px; }

    .quicklink-redirect { display: inline-block; position: relative; }
    .quicklink-redirect::after {
        content: ''; position: absolute; left: 0; bottom: -2px;
        width: 0; height: 2px; background: var(--blue);
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .quicklink-redirect.active::after { width: 100%; }

    .feature-panel {
        position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%) translateY(20px);
        width: 90%; max-width: 680px; max-height: 55vh;
        background: var(--surf); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px; padding: 20px; z-index: 10;
        box-shadow: 0 8px 48px rgba(0,0,0,0.6);
        opacity: 0; pointer-events: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
        display: flex; flex-direction: column;
        scroll-behavior: smooth;
    }
    .feature-panel.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .feature-panel::-webkit-scrollbar { width: 4px; }
    .feature-panel::-webkit-scrollbar-track { background: transparent; }
    .feature-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .feature-header {
        display: flex; justify-content: space-between;
        align-items: center; margin-bottom: 12px;
        padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);
        flex-shrink: 0;
    }
    .feature-header .title {
        font-weight: 500; color: var(--sec); font-size: 0.9rem;
        display: flex; align-items: center; gap: 8px;
        background: none; -webkit-text-fill-color: initial;
    }
    .feature-header .title .icon { color: var(--blue); width: 20px; height: 20px; }
    .feature-header .close-panel {
        background: transparent; border: none; color: var(--sec);
        cursor: pointer; padding: 4px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.2s ease;
    }
    .feature-header .close-panel:hover { background: rgba(255,255,255,0.08); }

    .feature-content {
        flex: 1; display: flex; flex-direction: column;
        min-height: 100px; max-height: 40vh;
        overflow-y: auto; padding-right: 4px;
    }
    .feature-content::-webkit-scrollbar { width: 3px; }
    .feature-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    /* Clock */
    .clock-display {
        font-size: 4rem; font-weight: 300;
        text-align: center; padding: 20px 0;
        font-variant-numeric: tabular-nums;
        letter-spacing: 2px; color: #fff;
    }
    .clock-date { font-size: 1.1rem; color: var(--sec); text-align: center; margin-top: 8px; }

    /* Todo */
    .todo-input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .todo-input-row input {
        flex: 1; padding: 10px 14px;
        background: #282a2c; border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px; color: var(--txt);
        font-family: var(--fnt); font-size: 0.95rem; outline: none;
    }
    .todo-input-row input:focus { border-color: var(--blue-sol); }
    .todo-input-row button {
        background: var(--blue); color: #042f66;
        border: none; padding: 10px 18px;
        border-radius: 12px; font-family: var(--fnt);
        font-weight: 500; font-size: 0.9rem; cursor: pointer;
    }
    .todo-input-row button:hover { background: #c2dbff; }
    .todo-item {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; background: rgba(255,255,255,0.03);
        border-radius: 10px; margin-bottom: 6px;
    }
    .todo-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--blue-sol); cursor: pointer; flex-shrink: 0; }
    .todo-item .todo-text { flex: 1; font-size: 0.95rem; word-break: break-word; }
    .todo-item .todo-text.done { text-decoration: line-through; color: var(--sec); }
    .todo-item .todo-del {
        background: transparent; border: none; color: var(--sec);
        cursor: pointer; padding: 4px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s ease;
    }
    .todo-item .todo-del:hover { color: #ff6b6b; background: rgba(255,0,0,0.1); }
    .todo-item .todo-del .icon { width: 18px; height: 18px; }
    .todo-empty { color: var(--sec); text-align: center; padding: 30px 0; font-size: 0.95rem; }

    /* Timer */
    .timer-display {
        font-size: 3.5rem; font-weight: 300;
        text-align: center; padding: 10px 0;
        font-variant-numeric: tabular-nums; letter-spacing: 2px;
    }
    .timer-controls { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    .timer-controls button {
        background: rgba(255,255,255,0.08); color: var(--txt);
        border: none; padding: 10px 20px; border-radius: 100px;
        font-family: var(--fnt); font-size: 0.9rem; cursor: pointer;
        transition: background 0.2s ease;
    }
    .timer-controls button:hover { background: rgba(255,255,255,0.15); }
    .timer-controls button.primary { background: var(--blue); color: #042f66; }
    .timer-controls button.primary:hover { background: #c2dbff; }
    .timer-presets { display: flex; gap: 8px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
    .timer-presets button {
        background: rgba(255,255,255,0.05); color: var(--sec);
        border: 1px solid rgba(255,255,255,0.08);
        padding: 6px 14px; border-radius: 100px;
        font-family: var(--fnt); font-size: 0.85rem; cursor: pointer;
        transition: all 0.2s ease;
    }
    .timer-presets button:hover { background: rgba(255,255,255,0.1); color: var(--txt); }

    /* Stopwatch */
    .stopwatch-laps { margin-top: 12px; max-height: 150px; overflow-y: auto; }
    .stopwatch-lap {
        display: flex; justify-content: space-between;
        padding: 6px 12px; font-size: 0.9rem;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .stopwatch-lap:last-child { border-bottom: none; }
    .stopwatch-lap .lap-num { color: var(--sec); }
    .stopwatch-lap .lap-time { font-variant-numeric: tabular-nums; }

    /* Notes */
    .notes-textarea {
        width: 100%; min-height: 200px;
        background: #282a2c; border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px; color: var(--txt);
        font-family: var(--fnt); font-size: 0.95rem;
        padding: 14px; outline: none; resize: vertical;
        box-sizing: border-box; line-height: 1.6;
    }
    .notes-textarea:focus { border-color: var(--blue-sol); }
    .notes-status { font-size: 0.8rem; color: var(--sec); text-align: right; margin-top: 6px; }

    /* Terminal */
    .terminal-output {
        flex: 1; min-height: 200px; max-height: 35vh;
        overflow-y: auto; font-family: var(--mono);
        font-size: 0.9rem; padding: 12px;
        background: rgba(0,0,0,0.3); border-radius: 12px;
        margin-bottom: 10px; line-height: 1.5;
        white-space: pre-wrap; word-break: break-all;
    }
    .terminal-output::-webkit-scrollbar { width: 3px; }
    .terminal-output::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    .terminal-line { margin-bottom: 2px; }
    .terminal-line.cmd { color: var(--blue); }
    .terminal-line.err { color: #ff6b6b; }
    .terminal-line.out { color: var(--txt); }
    .terminal-line.info { color: var(--sec); }
    .terminal-input-row {
        display: flex; align-items: center; gap: 8px;
        background: #282a2c; border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px; padding: 0 14px;
    }
    .terminal-input-row:focus-within { border-color: var(--blue-sol); }
    .terminal-prompt { color: var(--blue); font-family: var(--mono); font-size: 0.9rem; font-weight: bold; white-space: nowrap; }
    .terminal-input-row input {
        flex: 1; background: transparent; border: none; outline: none;
        color: var(--txt); font-family: var(--mono);
        font-size: 0.9rem; padding: 12px 0;
    }

    /* Calculator */
    .calc-display {
        width: 100%; padding: 16px;
        background: #282a2c; border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px; color: var(--txt);
        font-family: var(--fnt); font-size: 1.8rem;
        text-align: right; box-sizing: border-box;
        margin-bottom: 12px; outline: none;
        font-variant-numeric: tabular-nums;
    }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .calc-btn {
        padding: 16px; border-radius: 12px;
        border: none; cursor: pointer;
        font-family: var(--fnt); font-size: 1.1rem;
        background: rgba(255,255,255,0.06);
        color: var(--txt);
        transition: background 0.15s ease, transform 0.1s ease;
    }
    .calc-btn:hover { background: rgba(255,255,255,0.12); }
    .calc-btn:active { transform: scale(0.96); }
    .calc-btn.op { background: rgba(168,199,250,0.15); color: var(--blue); }
    .calc-btn.eq { background: var(--blue); color: #042f66; }
    .calc-btn.eq:hover { background: #c2dbff; }
    .calc-btn.clear { background: rgba(255,107,107,0.15); color: #ff6b6b; }

    /* Color picker */
    .color-preview {
        width: 100%; height: 100px;
        border-radius: 12px; margin-bottom: 12px;
        border: 1px solid rgba(255,255,255,0.1);
    }
    .color-info { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--sec); margin-bottom: 8px; }
    .color-info span { color: var(--txt); font-family: var(--mono); }

    /* Whiteboard */
    .whiteboard-panel {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #ffffff; z-index: 90;
        display: none; flex-direction: column;
        transition: background 0.2s ease;
    }
    .whiteboard-panel.open { display: flex; }
    .whiteboard-panel.dark { background: #1a1a1a; }

    .wb-toolbar {
        display: flex; align-items: center; gap: 8px;
        padding: 12px 20px;
        background: rgba(255,255,255,0.9);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        flex-wrap: wrap; z-index: 2;
        backdrop-filter: blur(10px);
    }
    .whiteboard-panel.dark .wb-toolbar {
        background: rgba(30,31,32,0.9);
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .wb-toolbar button, .wb-toolbar .wb-tool {
        display: flex; align-items: center; justify-content: center;
        gap: 6px; padding: 8px 14px;
        border-radius: 10px; border: 1px solid rgba(0,0,0,0.08);
        background: #f5f5f5; color: #333;
        font-family: var(--fnt); font-size: 0.85rem;
        cursor: pointer; transition: all 0.15s ease;
    }
    .whiteboard-panel.dark .wb-toolbar button,
    .whiteboard-panel.dark .wb-toolbar .wb-tool {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.1);
        color: #e3e3e3;
    }
    .wb-toolbar button:hover, .wb-toolbar .wb-tool:hover { background: #e8e8e8; }
    .whiteboard-panel.dark .wb-toolbar button:hover,
    .whiteboard-panel.dark .wb-toolbar .wb-tool:hover { background: rgba(255,255,255,0.15); }
    .wb-toolbar button.active, .wb-toolbar .wb-tool.active {
        background: var(--blue-sol); color: #fff; border-color: var(--blue-sol);
    }
    .wb-toolbar .wb-tool .icon { width: 20px; height: 20px; }
    .wb-spacer { flex: 1; }
    .wb-color-input { width: 36px; height: 36px; padding: 0; border: none; border-radius: 50%; cursor: pointer; background: transparent; }
    .wb-size-slider { width: 80px; accent-color: var(--blue-sol); }
    .wb-zoom-display { font-size: 0.8rem; color: inherit; font-variant-numeric: tabular-nums; min-width: 48px; text-align: center; }
    .wb-canvas-wrapper { flex: 1; position: relative; overflow: hidden; background: #fff; }
    .whiteboard-panel.dark .wb-canvas-wrapper { background: #1a1a1a; }
    .wb-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
    .wb-text-input {
        position: absolute; background: transparent;
        border: 1px dashed var(--blue-sol); border-radius: 4px;
        padding: 2px 4px; font-family: var(--fnt);
        outline: none; min-width: 60px; display: none; z-index: 3;
    }
    .wb-text-input.active { display: block; }

    /* Greeting editor */
    .greeting-list {
        display: flex; flex-direction: column; gap: 6px;
        margin-bottom: 12px; max-height: 200px;
        overflow-y: auto; padding-right: 4px;
    }
    .greeting-list::-webkit-scrollbar { width: 3px; }
    .greeting-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    .greeting-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(255,255,255,0.03); border-radius: 10px; }
    .greeting-item input {
        flex: 1; background: transparent; border: none; outline: none;
        color: var(--txt); font-family: var(--fnt); font-size: 0.9rem;
        padding: 4px 6px; border-radius: 6px;
        border: 1px solid transparent; min-width: 0;
    }
    .greeting-item input:focus { border-color: var(--blue-sol); background: rgba(0,0,0,0.2); }
    .greeting-item .greeting-del {
        background: transparent; border: none; color: var(--sec);
        cursor: pointer; padding: 4px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s ease; flex-shrink: 0;
    }
    .greeting-item .greeting-del:hover { color: #ff6b6b; background: rgba(255,0,0,0.1); }
    .greeting-item .greeting-del .icon { width: 18px; height: 18px; }
    .greeting-add-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .greeting-add-row input {
        flex: 1; padding: 10px 14px;
        background: #282a2c; border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px; color: var(--txt);
        font-family: var(--fnt); font-size: 0.9rem; outline: none;
    }
    .greeting-add-row input:focus { border-color: var(--blue-sol); }
    .greeting-add-row button {
        background: var(--blue); color: #042f66;
        border: none; padding: 10px 18px;
        border-radius: 12px; font-family: var(--fnt);
        font-weight: 500; font-size: 0.9rem; cursor: pointer;
    }
    .greeting-add-row button:hover { background: #c2dbff; }
    .greeting-reset-btn {
        background: rgba(255,255,255,0.08); color: var(--sec);
        border: none; padding: 10px 18px;
        border-radius: 100px; font-family: var(--fnt);
        font-size: 0.85rem; cursor: pointer;
        margin-top: 4px; width: 100%;
    }
    .greeting-reset-btn:hover { background: rgba(255,255,255,0.15); color: var(--txt); }
    .settings-section-title {
        font-size: 0.85rem; color: var(--blue); font-weight: 500;
        margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* Aurora */
    .aurora-view {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 350px;
        pointer-events: none; overflow: visible; z-index: 1;
    }
    .aurora-field {
        position: absolute; bottom: -120px; left: -20%; width: 140%; height: 450px;
        filter: blur(80px); opacity: 0.85; display: flex; align-items: flex-end;
        overflow: visible;
    }
    .wave { position: absolute; bottom: 0; height: 100%; mix-blend-mode: screen; transform-origin: bottom center; }
    .w-b { left: -10%; width: 75%; background: radial-gradient(ellipse at bottom, #1a73e8 0%, transparent 75%); animation: drift1 10s infinite ease-in-out alternate; }
    .w-p { left: 10%; width: 70%; background: radial-gradient(ellipse at bottom, #a142f4 0%, transparent 75%); animation: drift2 8s infinite ease-in-out alternate-reverse; }
    .w-k { right: 10%; width: 65%; background: radial-gradient(ellipse at bottom, #ff63b4 0%, transparent 75%); animation: drift3 9s infinite ease-in-out alternate; }
    .w-a { right: -10%; width: 55%; background: radial-gradient(ellipse at bottom, #fbbc04 0%, transparent 75%); animation: drift4 7s infinite ease-in-out alternate-reverse; }

    @keyframes drift1 {
        0% { transform: scaleY(0.7) scaleX(0.9) translateX(-2%) rotate(-1deg); opacity: 0.6; }
        50% { transform: scaleY(1.1) scaleX(1.05) translateX(2%) rotate(1deg); opacity: 0.9; }
        100% { transform: scaleY(0.8) scaleX(0.95) translateX(-1%) rotate(0deg); opacity: 0.7; }
    }
    @keyframes drift2 {
        0% { transform: scaleY(1.0) scaleX(1.0) translateX(2%) rotate(1deg); opacity: 0.85; }
        50% { transform: scaleY(0.65) scaleX(0.85) translateX(-3%) rotate(-1deg); opacity: 0.6; }
        100% { transform: scaleY(1.1) scaleX(0.95) translateX(1%) rotate(0deg); opacity: 0.85; }
    }
    @keyframes drift3 {
        0% { transform: scaleY(0.75) scaleX(0.85) translateX(-1%) rotate(0deg); opacity: 0.65; }
        50% { transform: scaleY(1.0) scaleX(1.1) translateX(3%) rotate(2deg); opacity: 0.9; }
        100% { transform: scaleY(0.7) scaleX(0.9) translateX(-1%) rotate(-1deg); opacity: 0.65; }
    }
    @keyframes drift4 {
        0% { transform: scaleY(1.05) scaleX(1.05) translateX(1%) rotate(1deg); opacity: 0.8; }
        50% { transform: scaleY(0.7) scaleX(0.85) translateX(-2%) rotate(-1deg); opacity: 0.55; }
        100% { transform: scaleY(0.95) scaleX(1.0) translateX(2%) rotate(1deg); opacity: 0.8; }
    }

    .line {
        position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
        background: linear-gradient(90deg, #1a73e8, #a142f4, #ff63b4, #fbbc04, #1a73e8);
        opacity: 0.3; filter: blur(1px); z-index: 2;
    }
</style>
</head>

<script>
    // ---------- Default greetings ----------
    const DEFAULT_GREETINGS = [
        "What's up, {name}?",
        "How's it going, {name}?",
        "Hi, {name}.",
        "Hello, {name}.",
        "How are you, {name}?",
        "Hey, {name}.",
        "Welcome back, {name}.",
        "Good to see you, {name}.",
        "Sup, {name}.",
        "Let's get started, {name}.",
        "What's the plan, {name}?",
    ];

    // ---------- Loading sequence ----------
    document.addEventListener('DOMContentLoaded', () => {
        const loadingScreen = document.getElementById('loading-screen');
        const content = document.getElementById('content');
        setTimeout(() => {
            loadingScreen.classList.add('hidden');
            content.classList.add('show');
        }, 300);
    });

    // ---------- State ----------
    const state = {
        name: localStorage.getItem('g_name') || 'Friend',
        links: JSON.parse(localStorage.getItem('g_links') || '{}'),
        avatar: localStorage.getItem('g_avatar') || '',
        todos: JSON.parse(localStorage.getItem('g_todos') || '[]'),
        notes: localStorage.getItem('g_notes') || '',
        greetings: JSON.parse(localStorage.getItem('g_greetings') || 'null')
    };

    // ---------- URL parameter overrides ----------
    (function applyUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const consumed = new Set();

        const nameParam = params.get('name');
        if (nameParam && nameParam.trim()) {
            state.name = nameParam.trim().slice(0, 18);
            localStorage.setItem('g_name', state.name);
            consumed.add('name');
        }

        const avatarParam = params.get('avatar');
        if (avatarParam && avatarParam.trim()) {
            state.avatar = avatarParam.trim();
            localStorage.setItem('g_avatar', state.avatar);
            consumed.add('avatar');
        }

        if (consumed.size) {
            consumed.forEach(k => params.delete(k));
            const qs = params.toString();
            const cleanUrl = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
            try { history.replaceState(null, '', cleanUrl); } catch (e) {}
        }
    })();

    if (!state.greetings || !Array.isArray(state.greetings) || state.greetings.length === 0) {
        state.greetings = [...DEFAULT_GREETINGS];
    }

    // ---------- DOM refs ----------
    const out = document.getElementById('out');
    const box = document.getElementById('box');
    const mask = document.getElementById('mask');
    const openBtn = document.getElementById('profileBtn');
    const closeBtn = document.getElementById('close');
    const promptInput = document.getElementById('promptInput');
    const promptBtn = document.getElementById('promptBtn');
    const pageTitle = document.getElementById('pageTitle');
    const notifier = document.getElementById('notifier');
    const profileInitials = document.getElementById('profileInitials');
    const profileImg = document.getElementById('profileImg');
    const dialogTitle = document.getElementById('dialogTitle');
    const dialogContent = document.getElementById('dialogContent');
    const appLauncherBtn = document.getElementById('appLauncherBtn');
    const appGridPopup = document.getElementById('appGridPopup');

    const clockPanel = document.getElementById('clockPanel');
    const clockDisplay = document.getElementById('clockDisplay');
    const clockDate = document.getElementById('clockDate');
    const todoPanel = document.getElementById('todoPanel');
    const todoInput = document.getElementById('todoInput');
    const todoAddBtn = document.getElementById('todoAddBtn');
    const todoList = document.getElementById('todoList');
    const timerPanel = document.getElementById('timerPanel');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerToggle = document.getElementById('timerToggle');
    const timerReset = document.getElementById('timerReset');
    const stopwatchPanel = document.getElementById('stopwatchPanel');
    const stopwatchDisplay = document.getElementById('stopwatchDisplay');
    const stopwatchToggle = document.getElementById('stopwatchToggle');
    const stopwatchLap = document.getElementById('stopwatchLap');
    const stopwatchReset = document.getElementById('stopwatchReset');
    const stopwatchLaps = document.getElementById('stopwatchLaps');
    const notesPanel = document.getElementById('notesPanel');
    const notesTextarea = document.getElementById('notesTextarea');
    const notesStatus = document.getElementById('notesStatus');
    const terminalPanel = document.getElementById('terminalPanel');
    const terminalOutput = document.getElementById('terminalOutput');
    const terminalInput = document.getElementById('terminalInput');
    const calcPanel = document.getElementById('calcPanel');
    const calcDisplay = document.getElementById('calcDisplay');
    const colorPanel = document.getElementById('colorPanel');
    const colorPreview = document.getElementById('colorPreview');
    const colorHex = document.getElementById('colorHex');
    const colorRgb = document.getElementById('colorRgb');
    const colorInput = document.getElementById('colorInput');
    const whiteboardPanel = document.getElementById('whiteboardPanel');

    let notifierTimeout = null;

    // Panel open/close helpers
    const allPanels = [clockPanel, todoPanel, timerPanel, stopwatchPanel, notesPanel, terminalPanel, calcPanel, colorPanel];
    function closeAllPanels() { allPanels.forEach(p => p.classList.remove('open')); }
    function openPanel(panel) { closeAllPanels(); panel.classList.add('open'); }

    document.querySelectorAll('.close-panel').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const target = document.getElementById(btn.dataset.panel);
            if (target) target.classList.remove('open');
        });
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.app-grid-popup') && !e.target.closest('.app-launcher-btn')) {
            appGridPopup.classList.remove('open');
        }
        if (e.target.closest('.feature-panel') || e.target.closest('.prompt-container') ||
            e.target.closest('.top-controls') || e.target.closest('.app-grid-popup') ||
            e.target.closest('.whiteboard-panel') || e.target.closest('.dialog') ||
            e.target.closest('.mask')) return;
        closeAllPanels();
    });

    // ---------- App Launcher ----------
    appLauncherBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        appGridPopup.classList.toggle('open');
    });

    document.querySelectorAll('.app-grid-item').forEach(item => {
        item.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const panelId = item.dataset.panel;
            if (panelId === 'clockPanel') { openPanel(clockPanel); startClock(); }
            else if (panelId === 'todoPanel') { openPanel(todoPanel); renderTodos(); }
            else if (panelId === 'timerPanel') { openPanel(timerPanel); }
            else if (panelId === 'stopwatchPanel') { openPanel(stopwatchPanel); }
            else if (panelId === 'notesPanel') { openPanel(notesPanel); loadNotes(); }
            else if (panelId === 'terminalPanel') { openPanel(terminalPanel); focusTerminal(); }
            else if (panelId === 'calcPanel') { openPanel(calcPanel); resetCalc(); }
            else if (panelId === 'colorPanel') { openPanel(colorPanel); initColorPicker(); }
            else if (panelId === 'whiteboardPanel') { openWhiteboard(); }
            appGridPopup.classList.remove('open');
        });
    });

    // ---------- Greeting ----------
    function getGreeting() {
        if (!state.greetings || state.greetings.length === 0) return `Hello, ${state.name}.`;
        const template = state.greetings[Math.floor(Math.random() * state.greetings.length)];
        return template.replace(/\{name\}/g, state.name);
    }

    function updateProfileUI() {
        if (state.avatar && state.avatar.trim()) {
            profileImg.src = state.avatar;
            profileImg.style.display = 'block';
            profileInitials.style.display = 'none';
        } else {
            profileImg.style.display = 'none';
            profileInitials.style.display = 'block';
            profileInitials.textContent = state.name.charAt(0).toUpperCase();
        }
    }

    function draw() {
        out.textContent = getGreeting();
        pageTitle.textContent = `Home \\ ${state.name}`;
        updateProfileUI();
    }

    function saveGreetings() { localStorage.setItem('g_greetings', JSON.stringify(state.greetings)); }

    // ---------- Notifier ----------
    function showNotifier(message, type = 'success') {
        if (notifierTimeout) clearTimeout(notifierTimeout);
        const iconId = type === 'success' ? 'check-circle' : type === 'error' ? 'error' : 'info';
        notifier.innerHTML = `<svg class="icon icon-sm"><use href="#i-${iconId}"/></svg> <span></span>`;
        notifier.querySelector('span').textContent = message;
        notifier.className = 'notifier ' + type;
        void notifier.offsetWidth;
        notifier.classList.add('show');
        notifierTimeout = setTimeout(() => notifier.classList.remove('show'), 2500);
    }

    // ---------- Settings dialog ----------
    function renderGreetingEditor() {
        let html = `
            <div class="settings-section-title">Custom Greetings</div>
            <div style="font-size:0.8rem;color:var(--sec);margin-bottom:10px;">
                Use <strong>{name}</strong> as a placeholder for your name.
            </div>
            <div class="greeting-list" id="greetingList">
        `;
        state.greetings.forEach((g, i) => {
            html += `
                <div class="greeting-item">
                    <input type="text" data-index="${i}" value="${g.replace(/"/g, '&quot;')}" placeholder="Greeting...">
                    <button class="greeting-del" data-index="${i}">
                        <svg class="icon"><use href="#i-close"/></svg>
                    </button>
                </div>
            `;
        });
        html += `</div>
            <div class="greeting-add-row">
                <input type="text" id="newGreetingInput" placeholder="Add new greeting...">
                <button id="addGreetingBtn">Add</button>
            </div>
            <button class="greeting-reset-btn" id="resetGreetingsBtn">Reset to Defaults</button>
        `;
        return html;
    }

    function refreshGreetingList() {
        const greetingList = document.getElementById('greetingList');
        if (!greetingList) return;
        let html = '';
        state.greetings.forEach((g, i) => {
            html += `
                <div class="greeting-item">
                    <input type="text" data-index="${i}" value="${g.replace(/"/g, '&quot;')}" placeholder="Greeting...">
                    <button class="greeting-del" data-index="${i}">
                        <svg class="icon"><use href="#i-close"/></svg>
                    </button>
                </div>
            `;
        });
        greetingList.innerHTML = html;
        bindGreetingEditor();
    }

    function bindGreetingEditor() {
        const greetingList = document.getElementById('greetingList');
        const newGreetingInput = document.getElementById('newGreetingInput');
        const addGreetingBtn = document.getElementById('addGreetingBtn');
        const resetGreetingsBtn = document.getElementById('resetGreetingsBtn');

        if (greetingList) {
            greetingList.querySelectorAll('input[type="text"]').forEach(inp => {
                inp.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    const val = e.target.value.trim();
                    if (val) { state.greetings[idx] = val; saveGreetings(); }
                    else { state.greetings.splice(idx, 1); saveGreetings(); refreshGreetingList(); }
                });
            });
            greetingList.querySelectorAll('.greeting-del').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(e.currentTarget.dataset.index);
                    state.greetings.splice(idx, 1);
                    saveGreetings();
                    refreshGreetingList();
                });
            });
        }
        if (addGreetingBtn && newGreetingInput) {
            addGreetingBtn.addEventListener('click', () => {
                const val = newGreetingInput.value.trim();
                if (val) {
                    state.greetings.push(val);
                    saveGreetings();
                    newGreetingInput.value = '';
                    refreshGreetingList();
                }
            });
            newGreetingInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addGreetingBtn.click(); });
        }
        if (resetGreetingsBtn) {
            resetGreetingsBtn.addEventListener('click', () => {
                state.greetings = [...DEFAULT_GREETINGS];
                saveGreetings();
                refreshGreetingList();
                showNotifier('Greetings reset to defaults');
            });
        }
    }

    function view(show, title = 'Settings', content = null) {
        if (show) {
            dialogTitle.textContent = title;
            if (content) {
                dialogContent.innerHTML = content;
            } else {
                dialogContent.innerHTML = `
                    <div class="f-group">
                        <label class="f-lbl" for="userIn">Preferred Name</label>
                        <input type="text" id="userIn" class="f-in" placeholder="Enter name..." maxlength="18" value="${state.name}">
                    </div>
                    <div class="f-group">
                        <label class="f-lbl">Profile Image</label>
                        <div class="upload-area" id="uploadArea">
                            <img id="uploadPreview" class="upload-preview" alt="Preview" src="${state.avatar || ''}">
                            <div class="upload-text" id="uploadText" style="${state.avatar ? 'display:none' : ''}">
                                <strong>Click to upload</strong> or drag &amp; drop<br>
                                <span style="font-size:0.8rem;color:var(--sec);">PNG, JPG, GIF, WEBP (max 2MB)</span>
                            </div>
                            <input type="file" id="fileInput" accept="image/*">
                            <div class="upload-actions">
                                <button class="btn-upload" id="uploadBtn">
                                    <svg class="icon icon-sm"><use href="#i-upload"/></svg> Upload
                                </button>
                                <button class="btn-remove" id="removeAvatarBtn">
                                    <svg class="icon icon-sm"><use href="#i-trash"/></svg> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="f-group">
                        <label class="f-lbl">Or use URL</label>
                        <input type="text" id="avatarIn" class="f-in" placeholder="https://example.com/avatar.jpg" value="${state.avatar}">
                    </div>
                    ${renderGreetingEditor()}
                    <button class="f-btn" id="save">Confirm</button>
                `;
                setTimeout(() => {
                    const userIn = document.getElementById('userIn');
                    const avatarIn = document.getElementById('avatarIn');
                    const saveBtn = document.getElementById('save');
                    const uploadArea = document.getElementById('uploadArea');
                    const fileInput = document.getElementById('fileInput');
                    const uploadPreview = document.getElementById('uploadPreview');
                    const uploadText = document.getElementById('uploadText');
                    const uploadBtn = document.getElementById('uploadBtn');
                    const removeAvatarBtn = document.getElementById('removeAvatarBtn');

                    bindGreetingEditor();

                    function handleImageUpload(file) {
                        if (!file) return;
                        if (!file.type.startsWith('image/')) { showNotifier('Please upload an image file', 'error'); return; }
                        if (file.size > 2 * 1024 * 1024) { showNotifier('Image must be under 2MB', 'error'); return; }
                        compressImage(file).then(dataUrl => {
                            state.avatar = dataUrl;
                            saveAvatar();
                            draw();
                            if (uploadPreview) { uploadPreview.src = dataUrl; uploadPreview.classList.add('show'); }
                            if (uploadText) uploadText.style.display = 'none';
                            showNotifier('Profile image uploaded!');
                        }).catch(() => showNotifier('Failed to process image', 'error'));
                    }

                    if (uploadArea) {
                        uploadArea.addEventListener('click', (e) => {
                            if (e.target.closest('.upload-actions')) return;
                            fileInput.click();
                        });
                        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
                        uploadArea.addEventListener('dragleave', (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); });
                        uploadArea.addEventListener('drop', (e) => {
                            e.preventDefault();
                            uploadArea.classList.remove('dragover');
                            if (e.dataTransfer.files.length) handleImageUpload(e.dataTransfer.files[0]);
                        });
                    }
                    if (fileInput) fileInput.addEventListener('change', (e) => {
                        if (e.target.files.length) handleImageUpload(e.target.files[0]);
                        fileInput.value = '';
                    });
                    if (uploadBtn) uploadBtn.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
                    if (removeAvatarBtn) removeAvatarBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        state.avatar = '';
                        saveAvatar();
                        draw();
                        if (uploadPreview) uploadPreview.classList.remove('show');
                        if (uploadText) uploadText.style.display = 'block';
                        showNotifier('Avatar removed');
                    });

                    if (avatarIn) {
                        avatarIn.addEventListener('input', () => {
                            state.avatar = avatarIn.value;
                            saveAvatar();
                            draw();
                        });
                    }
                    if (userIn && saveBtn) {
                        userIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveBtn.click(); });
                        saveBtn.addEventListener('click', () => {
                            const v = userIn.value.trim();
                            const a = avatarIn.value.trim();
                            if (v) { state.name = v; localStorage.setItem('g_name', v); }
                            if (a) { state.avatar = a; saveAvatar(); }
                            saveGreetings();
                            draw();
                            view(false);
                            showNotifier('Settings updated!');
                        });
                    }
                }, 0);
            }
            box.classList.add('open');
            mask.classList.add('active');
        } else {
            box.classList.remove('open');
            mask.classList.remove('active');
        }
    }

    function compressImage(file, maxWidth = 400, maxHeight = 400, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > maxWidth) { height = height * (maxWidth / width); width = maxWidth; }
                    if (height > maxHeight) { width = width * (maxHeight / height); height = maxHeight; }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // ---------- Search / quicklink handling ----------
    function handleSearch(query) {
        if (!query.trim()) return;

        const parts = query.trim().split(/\s+/);
        const first = parts[0];

        if (state.links[first]) {
            let baseUrl = state.links[first];
            let path = parts.slice(1).join('/');
            let url = baseUrl;
            if (path) url = baseUrl.replace(/\/$/, '') + '/' + path;
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

            promptInput.value = '';
            out.classList.add('quicklink-redirect');
            out.classList.add('active');
            showNotifier(`Opening "${first}"...`);
            setTimeout(() => { window.location.href = url; }, 500);
            return;
        }

        if (query.includes('.') && !query.includes(' ')) {
            let url = query;
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
            promptInput.value = '';
            window.location.href = url;
            return;
        }

        window.location.href = `biggle://nox?q=${encodeURIComponent(query)}`;
        promptInput.value = '';
    }

    // ---------- Whiteboard ----------

    const wbPenBtn = document.getElementById('wbPenBtn');
    const wbTextBtn = document.getElementById('wbTextBtn');
    const wbEraserBtn = document.getElementById('wbEraserBtn');

    let wbTool = 'pen';

    function initOffscreen(w, h) {

        wbOffCtx.lineJoin = 'round';

    function redrawCanvas() {
        wbCtx.save();
        wbCtx.setTransform(1, 0, 0, 1, 0, 0);
        wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height);
        wbCtx.restore();
        const dpr = window.devicePixelRatio || 1;
        wbCtx.save();
        wbCtx.setTransform(dpr * wbZoom, 0, 0, dpr * wbZoom, 0, 0);
        wbCtx.drawImage(wbOffscreen, 0, 0);
        wbCtx.restore();
        wbZoomDisplay.textContent = Math.round(wbZoom * 100) + '%';
    }

    function resizeWbCanvas() {
        const rect = wbCanvasWrapper.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        wbCanvas.width = rect.width * dpr;
        wbCanvas.height = rect.height * dpr;
        wbCanvas.style.width = rect.width + 'px';
        wbCanvas.style.height = rect.height + 'px';
        if (wbBaseWidth === 0 || wbBaseHeight === 0) {
            wbBaseWidth = rect.width;
            wbBaseHeight = rect.height;
            initOffscreen(wbBaseWidth, wbBaseHeight);
        }
        redrawCanvas();
        applyWbTheme();
    }

    function applyWbTheme() {

    function openWhiteboard() {

    }

    function setWbTool(tool) {
        wbTool = tool;
        [wbNoneBtn, wbPenBtn, wbTextBtn, wbEraserBtn].forEach(b => b.classList.remove('active'));
        if (tool === 'none') wbNoneBtn.classList.add('active');
        else if (tool === 'pen') wbPenBtn.classList.add('active');
        else if (tool === 'text') wbTextBtn.classList.add('active');
        else if (tool === 'eraser') wbEraserBtn.classList.add('active');

        if (tool === 'text') wbCanvas.style.cursor = 'text';
        else if (tool === 'none') { wbCanvas.style.cursor = 'grab'; hideWbTextInput(); }
        else { wbCanvas.style.cursor = 'crosshair'; hideWbTextInput(); }
    }

    function hideWbTextInput() {
        wbTextInput.classList.remove('active');
        wbTextInput.value = '';
    }

    function getCanvasPos(e) {
        const rect = wbCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (clientX - rect.left) / wbZoom, y: (clientY - rect.top) / wbZoom };
    }

    function wbStart(e) {
        if (wbTool === 'none') return;
        if (wbTool === 'text') {
            const rect = wbCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const screenX = clientX - rect.left;
            const screenY = clientY - rect.top;
            wbTextInput.style.left = screenX + 'px';
            wbTextInput.style.top = screenY + 'px';
            wbTextInput.style.color = wbColor.value;
            wbTextInput.style.fontSize = (parseInt(wbSize.value) * 4 + 12) + 'px';
            wbTextInput.classList.add('active');
            wbTextInput.focus();
            return;
        }
        e.preventDefault();
        wbDrawing = true;
        const pos = getCanvasPos(e);
        wbLastX = pos.x;
        wbLastY = pos.y;
    }

    function wbMove(e) {
        if (!wbDrawing) return;
        e.preventDefault();
        const pos = getCanvasPos(e);
        wbOffCtx.beginPath();
        wbOffCtx.moveTo(wbLastX, wbLastY);
        wbOffCtx.lineTo(pos.x, pos.y);
        if (wbTool === 'eraser') {
            wbOffCtx.globalCompositeOperation = 'destination-out';
            wbOffCtx.strokeStyle = 'rgba(0,0,0,1)';
            wbOffCtx.lineWidth = parseInt(wbSize.value) * 3;
        } else {
            wbOffCtx.globalCompositeOperation = 'source-over';
            wbOffCtx.strokeStyle = wbColor.value;
            wbOffCtx.lineWidth = parseInt(wbSize.value);
        }
        wbOffCtx.stroke();
        wbLastX = pos.x;
        wbLastY = pos.y;
        redrawCanvas();
    }

    function wbEnd() {
        if (wbDrawing) {
            wbDrawing = false;
            wbOffCtx.globalCompositeOperation = 'source-over';
        }
    }

    function wbCommitText() {
        const text = wbTextInput.value.trim();
        if (!text) { hideWbTextInput(); return; }
        const screenX = parseFloat(wbTextInput.style.left) || 0;
        const screenY = parseFloat(wbTextInput.style.top) || 0;
        const x = screenX / wbZoom;
        const y = screenY / wbZoom;
        const fontSize = parseInt(wbSize.value) * 4 + 12;
        wbOffCtx.font = `${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        wbOffCtx.fillStyle = wbColor.value;
        wbOffCtx.globalCompositeOperation = 'source-over';
        wbOffCtx.textBaseline = 'top';
        wbOffCtx.fillText(text, x, y);
        hideWbTextInput();
        redrawCanvas();
    }

    // ---------- Special commands ----------
    const panelCommands = {

    function focusTerminal() { setTimeout(() => terminalInput.focus(), 100); }

    function doSearch() {
        const input = promptInput.value.trim();
        if (!input) return;

        const parts = input.split(' ');
        const first = parts[0].toLowerCase();

        if (panelCommands[first]) {
            promptInput.value = '';
            panelCommands[first]();
            return;
        }

        if (parts[0] === '/add' && parts.length >= 3) {
            const key = parts[1];
            const url = parts.slice(2).join(' ');
            if (key && url) { state.links[key] = url; saveLinks(); showNotifier(`Added "${key}"`); promptInput.value = ''; return; }
        }
        if (parts[0] === '/remove' && parts.length === 2) {
            const key = parts[1];
            if (state.links[key]) { delete state.links[key]; saveLinks(); showNotifier(`Removed "${key}"`); promptInput.value = ''; return; }
            else { showNotifier(`"${key}" not found`, 'error'); promptInput.value = ''; return; }
        }
        if (parts[0] === '/view') {
            const keys = Object.keys(state.links);
            if (keys.length === 0) { showNotifier('No quicklinks saved.', 'error'); promptInput.value = ''; return; }
            let content = '<div style="margin-bottom:12px;color:var(--sec);font-size:0.9rem;">Click edit to edit, delete to delete</div>';
            keys.forEach(key => {
                content += `
                    <div class="link-item">
                        <div class="link-info">
                            <span class="link-key">${key}</span>
                            <span class="link-url">${state.links[key]}</span>
                        </div>
                        <div class="link-actions">
                            <button class="edit-link" data-key="${key}" data-url="${state.links[key]}">
                                <svg class="icon"><use href="#i-pencil"/></svg>
                            </button>
                            <button class="del" data-key="${key}">
                                <svg class="icon"><use href="#i-trash"/></svg>
                            </button>
                        </div>
                    </div>
                `;
            });
            view(true, 'Quicklinks', content);
            setTimeout(() => {
                document.querySelectorAll('.edit-link').forEach(btn => {
                    btn.addEventListener('click', function () {
                        const key = this.dataset.key;
                        const url = this.dataset.url;
                        const newUrl = prompt(`Edit URL for "${key}":`, url);
                        if (newUrl !== null && newUrl.trim()) {
                            state.links[key] = newUrl.trim();
                            saveLinks();
                            showNotifier(`Updated "${key}"`);
                            view(false);
                            setTimeout(() => { doSearch(''); }, 0);
                        }
                    });
                });
                document.querySelectorAll('.del').forEach(btn => {
                    btn.addEventListener('click', function () {
                        const key = this.dataset.key;
                        if (confirm(`Delete "${key}"?`)) {
                            delete state.links[key];
                            saveLinks();
                            showNotifier(`Deleted "${key}"`);
                            view(false);
                        }
                    });
                });
            }, 0);
            promptInput.value = '';
            return;
        }

        handleSearch(input);
    }

    // ---------- Clock ----------
    let clockInterval = null;
    function startClock() {
        if (clockInterval) clearInterval(clockInterval);
        function tick() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            clockDisplay.textContent = `${h}:${m}:${s}`;
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            clockDate.textContent = now.toLocaleDateString(undefined, options);
        }
        tick();
        clockInterval = setInterval(tick, 1000);
    }

        if (!todoList) return;

            todoList.innerHTML = '<div class="todo-empty">No todos yet. Add one above!</div>';
            return;
        }
        todoList.innerHTML = state.todos.map((todo, i) => `

                <input type="checkbox" data-index="${i}" ${todo.done ? 'checked' : ''}>

        todoList.querySelectorAll('.todo-text').forEach((el, i) => { el.textContent = state.todos[i].text; });
        todoList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', (e) => {
                const idx = parseInt(e.target.dataset.index);
                state.todos[idx].done = e.target.checked;
                saveTodos();
                renderTodos();

    function addTodo() {

    // ---------- Timer ----------
    let timerSeconds = 0;
    let timerInterval = null;
    let timerRunning = false;
    let timerTotal = 0;

    function updateTimerDisplay() {
        const m = Math.floor(timerSeconds / 60);
        const s = timerSeconds % 60;
        timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function startTimer() {
        if (timerRunning) {
            clearInterval(timerInterval);
            timerRunning = false;
            timerToggle.textContent = 'Start';
            return;
        }
        if (timerSeconds <= 0) return;
        timerRunning = true;
        timerToggle.textContent = 'Pause';
        timerInterval = setInterval(() => {
            timerSeconds--;
            updateTimerDisplay();
            if (timerSeconds <= 0) {
                clearInterval(timerInterval);
                timerRunning = false;
                timerToggle.textContent = 'Start';
                showNotifier('Timer finished!', 'info');
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    osc.frequency.value = 800;
                    osc.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } catch (e) {}
            }
        }, 1000);
    }

    if (timerToggle) timerToggle.addEventListener('click', startTimer);
    if (timerReset) timerReset.addEventListener('click', () => {
        clearInterval(timerInterval);
        timerRunning = false;
        timerToggle.textContent = 'Start';
        timerSeconds = timerTotal || 0;
        updateTimerDisplay();
    });
    document.querySelectorAll('.timer-presets button').forEach(btn => {
        btn.addEventListener('click', () => {

        const centis = stopwatchTime % 100;
        stopwatchDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(centis).padStart(2, '0')}`;

        if (stopwatchRunning) {

            stopwatchRunning = false;
            stopwatchToggle.textContent = 'Start';
        } else {
            stopwatchRunning = true;
            stopwatchToggle.textContent = 'Pause';

                stopwatchTime++;
                updateStopwatchDisplay();
            }, 10);
        }

    // ---------- Terminal ----------
    function termPrint(text, cls = 'out') {
        const line = document.createElement('div');
        line.className = `terminal-line ${cls}`;
        line.textContent = text;
        terminalOutput.appendChild(line);
        terminalOutput.scrollTop = terminalOutput.scrollHeight;
    }
    function termInit() {
        terminalOutput.innerHTML = '';
        termPrint('Welcome to WebTerm v1.0', 'info');
        termPrint('Type "help" for available commands.', 'info');
        termPrint('', 'info');
    }
    function processCommand(cmd) {
        const parts = cmd.trim().split(/\s+/);
        const command = parts[0].toLowerCase();
        switch (command) {
            case 'help':
                termPrint('Available commands:', 'info');
                termPrint('  help          - Show this help', 'info');
                termPrint('  echo [text]   - Print text', 'info');
                termPrint('  date          - Show current date/time', 'info');
                termPrint('  clear         - Clear terminal', 'info');
                termPrint('  calc [expr]   - Calculate expression', 'info');
                termPrint('  open [url]    - Open URL in new tab', 'info');
                termPrint('  goto [url]    - Navigate to URL', 'info');
                termPrint('  ls            - List quicklinks', 'info');
                break;
            case 'echo':
                termPrint(parts.slice(1).join(' ') || '');
                break;
            case 'date':
                termPrint(new Date().toString());
                break;
            case 'clear':
                terminalOutput.innerHTML = '';
                break;
            case 'calc':
                try {
                    const expr = parts.slice(1).join(' ');
                    const result = Function('"use strict";return (' + expr + ')')();
                    termPrint(`${expr} = ${result}`);
                } catch (e) { termPrint('Invalid expression', 'err'); }
                break;
            case 'open': {
                const url = parts[1];
                if (url) {
                    let full = url;
                    if (!/^https?:\/\//i.test(full)) full = 'https://' + full;
                    window.open(full, '_blank');
                    termPrint(`Opened ${full}`, 'info');
                } else termPrint('Usage: open [url]', 'err');
                break;
            }
            case 'goto': {
                const gurl = parts[1];
                if (gurl) {
                    let full = gurl;
                    if (!/^https?:\/\//i.test(full)) full = 'https://' + full;
                    window.location.href = full;
                } else termPrint('Usage: goto [url]', 'err');
                break;
            }
            case 'ls': {
                const keys = Object.keys(state.links);
                if (keys.length === 0) termPrint('No quicklinks.', 'info');
                else keys.forEach(k => termPrint(`  ${k} -> ${state.links[k]}`, 'info'));
                break;
            }
            case '':
                break;
            default:
                termPrint(`Command not found: ${command}`, 'err');
        }
    }
    if (terminalInput) {
        terminalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = terminalInput.value.trim();
                if (cmd) {
                    termPrint(`$ ${cmd}`, 'cmd');
                    processCommand(cmd);
                }
                terminalInput.value = '';
            }
        });
    }
    termInit();

    // ---------- Global helpers ----------
    function saveLinks() { localStorage.setItem('g_links', JSON.stringify(state.links)); }

    openBtn.addEventListener('click', () => view(true));
    closeBtn.addEventListener('click', () => view(false));
    mask.addEventListener('click', () => view(false));
    promptBtn.addEventListener('click', doSearch);

    document.addEventListener('DOMContentLoaded', () => {
        draw();
        renderTodos();
        updateTimerDisplay();
        updateStopwatchDisplay();
        loadNotes();
    });

    draw();
</script>
</body>
</html>
